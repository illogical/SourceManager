services:
  sourcemanager:
    build:
      context: .
    container_name: sourcemanager
    restart: unless-stopped
    environment:
      SOURCEMANAGER_PORT: "${SOURCEMANAGER_PORT:?Set SOURCEMANAGER_PORT in .env}"
      SOURCEMANAGER_TOKEN: "${SOURCEMANAGER_TOKEN:?Set SOURCEMANAGER_TOKEN in .env}"
      SOURCEMANAGER_WORKSPACE_PATH: "${SOURCEMANAGER_WORKSPACE_PATH:?Set SOURCEMANAGER_WORKSPACE_PATH in .env.docker}"
    ports:
      - "${SOURCEMANAGER_PORT}:${SOURCEMANAGER_PORT}"
      # Publish every managed service port that must be reachable from the host.
      # - "3000:3000"
      # - "8080:8080"
    volumes:
      - ./data:/app/data
      - "${SOURCEMANAGER_HOST_WORKSPACE_PATH:?Set SOURCEMANAGER_HOST_WORKSPACE_PATH in .env}:/workspace/projects"
    init: true
