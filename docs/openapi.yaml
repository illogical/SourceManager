openapi: 3.1.0
info:
  title: SourceManager Unified Host API
  version: 2.0.0
servers:
  - url: /api/SourceManager
components:
  securitySchemes:
    DevServerToken:
      type: apiKey
      in: header
      name: X-DevServer-Token
security:
  - DevServerToken: []
paths:
  /projects:
    get:
      summary: List hosted project, build, Git, and load status
      responses:
        '200': { description: Project status }
        '401': { description: Invalid token }
  /events:
    get:
      summary: Read recent project-level events
      responses:
        '200': { description: Events }
  /config:
    get:
      summary: Read schema-v2 configuration
      responses:
        '200': { description: Configuration }
    put:
      summary: Validate and atomically save schema-v2 configuration
      responses:
        '200': { description: Saved; restart required }
        '400': { description: Invalid configuration }
  /config/validate:
    post:
      summary: Validate and diff without writing
      responses:
        '200': { description: Validation and diff }
  /config/preview-v1:
    post:
      summary: Preview a legacy conversion without writing
      responses:
        '200': { description: Conversion preview and warnings }
  /tailnet:
    get:
      summary: Read the global Tailnet advertisement status
      responses:
        '200': { description: Tailnet status }
  /tailnet/enable:
    post:
      summary: Enable the configured global advertisement
      responses:
        '200': { description: Enabled }
  /tailnet/disable:
    post:
      summary: Drain and disable the configured global advertisement
      responses:
        '200': { description: Disabled }
  /restart:
    post:
      summary: Request a graceful wrapper restart
      responses:
        '202': { description: Accepted }
        '409': { description: Blocked by active application work }
